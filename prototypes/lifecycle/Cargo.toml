[package]
name = "qoda-lifecycle-prototype"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
serde_json = "1"
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
