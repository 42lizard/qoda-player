[workspace]
resolver = "3"
members = ["crates/qoda-core", "crates/qoda-provider", "crates/qoda-backend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
roxmltree = "0.21"
bytes = "1"
futures-util = "0.3"
zeroize = "1"
axum = "0.8"
