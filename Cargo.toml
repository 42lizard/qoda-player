[workspace]
resolver = "3"
members = ["crates/qoda-core", "crates/qoda-provider", "crates/qoda-backend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process", "fs"] }
libc = "0.2"
alsa = "0.12.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
roxmltree = "0.21"
bytes = "1"
futures-util = "0.3"
zeroize = "1"
axum = "0.8"

rusqlite = { version = "0.41", features = ["backup"] }

sha2 = "0.10"
base64 = "0.22"
zbus = { version = "6.1", default-features = false, features = ["tokio", "service", "proxy"] }

# Inherited by every crate. Keep lint policy here rather than in individual files.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
